version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # D-0051: frontend/ (D-0038) has carried real npm dependencies since
  # Session 16, but this file only ever tracked composer/github-actions —
  # found while auditing Dependabot coverage for this session's own PR,
  # not something this session's dependency additions caused.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 is a ground-up rewrite (the Go-ported native compiler)
      # whose package no longer exposes the classic `lib/tsc.js` entry point
      # vue-tsc/@volar/typescript depend on to source-patch createProgram for
      # .vue SFC checking — confirmed by reproducing the failure locally
      # (PR #9), not just reading vue-tsc's changelog. Re-enable major-version
      # bumps here once @volar/typescript ships real TS7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
