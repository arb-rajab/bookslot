reason = "simple-git 3.36.0, fixed in 4.0.0. Only reachable via frontend/package-lock.json: nuxt > @nuxt/devtools@3.4.2 > simple-git@3.36.0. Nuxt DevTools is dev-server tooling, not part of the production frontend bundle. Forcing simple-git 4 via an npm override breaks `nuxt build` (v4 has no default export, which the consumer imports), and no released nuxt (checked 4.6.0) moves @nuxt/devtools off simple-git 3.x."

